services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: land_sales
      POSTGRES_USER: land_sales
      POSTGRES_PASSWORD: land_sales_dev
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]

  redis:
    image: redis:7
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: [redis_data:/data]

  backend:
    build: ./backend
    env_file: .env
    depends_on: [postgres, redis]
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on: [backend]
    ports: ["5173:5173"]

volumes:
  postgres_data:
  redis_data:
